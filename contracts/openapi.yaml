openapi: 3.1.0
info:
  title: Charity Donation & Beneficiary Portal API
  version: 0.1.0-provisional
  description: Development contract aligned to the current PostgreSQL baseline. Donation, payment and workflow writes
    remain disabled by default and require verified OIDC identity, the runtime database role, and explicit environment
    flags. Guest giving is named and capability-authorized; anonymous donations are not enabled.
servers:
- url: http://localhost:8000
tags:
- name: Campaigns
- name: Donations
- name: Campaign Management
- name: Beneficiaries
- name: Disbursements
paths:
  /api/v1/campaigns:
    get:
      tags:
      - Campaigns
      operationId: listCampaigns
      summary: List campaigns currently accepting donations
      description: Optional purpose, search, and sort filters are applied to eligible campaigns before ordering
        and pagination. The database-backed public campaign view and the authoritative write guard share the campaign_accepts_donations
        predicate. API validation and discovery do not replace database checks on write.
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 0
      - name: purpose_code
        in: query
        required: false
        description: Exact campaign purpose code from the controlled database vocabulary.
        schema:
          type: string
          enum:
          - GENERAL
          - FOOD
          - EDUCATION
          - HEALTH
          - SHELTER
      - name: search
        in: query
        required: false
        description: Case-insensitive literal substring search over campaign name, organization name, and purpose.
          Leading/trailing whitespace is trimmed; an empty value after trimming applies no search filter.
        schema:
          type: string
      - name: sort
        in: query
        required: false
        description: Sort order; campaign_id ascending breaks all ties.
        schema:
          type: string
          enum:
          - date
          - target_asc
          - target_desc
          default: date
      responses:
        '200':
          description: Page of eligible campaigns after filtering, ordered by requested sort and stable tie-breaker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignPage'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/campaigns/{campaign_id}:
    get:
      tags:
      - Campaigns
      operationId: getCampaign
      summary: Get a campaign currently accepting donations
      parameters:
      - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Eligible campaign detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignOut'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      tags:
      - Campaign Management
      operationId: updateCampaignDraft
      summary: Edit a campaign draft or rejected submission
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignDraftUpdate'
      responses:
        '200':
          description: Draft updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/donations:
    post:
      tags:
      - Donations
      operationId: createDonation
      summary: Create a pending registered or named guest donation
      description: Requires a durable creation idempotency key. A registered donor uses a verified OIDC bearer token;
        a guest supplies donor details and a high-entropy Guest-Access-Token capability. The same key and payload
        replay the persisted result; a different payload conflicts. The server checks campaign eligibility and creates
        the donor link, donation, audit event, guest digest and idempotency result atomically. Endpoint remains
        disabled unless workflow and donation-write flags are enabled.
      security:
      - BearerAuth: []
      - GuestAccessToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/GuestAccessToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDonationRequest'
      responses:
        '201':
          description: Persisted pending donation; no receipt is issued yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Donation'
        '200':
          description: Existing persisted donation returned for an identical replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Donation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/donations/{donation_id}/simulated-payment:
    post:
      tags:
      - Donations
      operationId: simulateDonationPayment
      summary: Submit a simulated payment outcome
      description: Simulation-only control available in an explicitly enabled development or test environment. Payment
        attempt, idempotency result and (for success) unique transaction reference, receipt, clearing ledger and
        audit commit atomically. TIMEOUT persists UNKNOWN and blocks another attempt until an authorized reconciliation
        decision. Transport timeout is recovered by replaying the same key or reading the owned donation. No payment
        provider is contacted.
      security:
      - BearerAuth: []
      - GuestAccessToken: []
      parameters:
      - $ref: '#/components/parameters/DonationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/GuestAccessToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulatedPaymentRequest'
      responses:
        '200':
          description: Persisted payment result; receipt appears only after committed clearing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Donation'
        '202':
          description: The simulated attempt remains unknown and needs authorized reconciliation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Donation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/donations/{donation_id}:
    get:
      tags:
      - Donations
      operationId: getDonation
      summary: Get the persisted donation and payment outcome
      description: Returns only a donation owned by the verified donor principal or matching guest capability.
      security:
      - BearerAuth: []
      - GuestAccessToken: []
      parameters:
      - $ref: '#/components/parameters/DonationId'
      - $ref: '#/components/parameters/GuestAccessToken'
      responses:
        '200':
          description: Persisted donation state; receipt only after successful clearing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Donation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/organizations/{organization_id}/campaigns:
    post:
      tags:
      - Campaign Management
      operationId: createCampaignDraft
      summary: Create a campaign draft for an organization the actor may manage
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignDraftInput'
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags:
      - Organization reads
      summary: Get Organization Campaigns
      operationId: get_organization_campaigns_api_v1_organizations__organization_id__campaigns_get
      security:
      - BearerAuth: []
      - BearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 19
          pattern: ^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$
          title: Organization Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000000
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationCampaignPage'
        '401':
          description: Authentication is required or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The authenticated actor is not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: An unexpected server error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Authentication service, database or workflow is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/campaigns/{campaign_id}/submission:
    post:
      tags:
      - Campaign Management
      operationId: submitCampaign
      summary: Submit or resubmit an organization campaign for review
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Submission recorded with audit event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/campaigns/{campaign_id}/review:
    post:
      tags:
      - Campaign Management
      operationId: reviewCampaign
      summary: Approve or reject a submitted campaign as a platform reviewer
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignReviewInput'
      responses:
        '200':
          description: Review decision persisted and audited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/campaigns/{campaign_id}/activation:
    post:
      tags:
      - Campaign Management
      operationId: activateCampaign
      summary: Publish an approved campaign inside its date window
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Campaign activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/organizations/{organization_id}/beneficiaries:
    post:
      tags:
      - Beneficiaries
      operationId: createBeneficiary
      summary: Create an organization-owned beneficiary pending verification
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeneficiaryInput'
      responses:
        '201':
          description: Beneficiary created pending verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags:
      - Organization reads
      summary: Get Organization Beneficiaries
      operationId: get_organization_beneficiaries_api_v1_organizations__organization_id__beneficiaries_get
      security:
      - BearerAuth: []
      - BearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 19
          pattern: ^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$
          title: Organization Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000000
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryPage'
        '401':
          description: Authentication is required or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The authenticated actor is not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: An unexpected server error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Authentication service, database or workflow is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/beneficiaries/{beneficiary_id}/verification:
    post:
      tags:
      - Beneficiaries
      operationId: verifyBeneficiary
      summary: Set verification state as an authorized platform verifier
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/BeneficiaryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeneficiaryVerificationInput'
      responses:
        '200':
          description: Verification state and audit event persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/campaigns/{campaign_id}/disbursements:
    post:
      tags:
      - Disbursements
      operationId: requestDisbursement
      summary: Request a purpose-checked payout to an organization beneficiary
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisbursementRequest'
      responses:
        '201':
          description: Pending disbursement request recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/disbursements/{disbursement_id}/approval:
    post:
      tags:
      - Disbursements
      operationId: approveDisbursement
      summary: Approve or reject a disbursement as a platform payout approver
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/DisbursementId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisbursementDecision'
      responses:
        '200':
          description: Decision persisted; requester and approver must differ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/disbursements/{disbursement_id}/payment:
    post:
      tags:
      - Disbursements
      operationId: payDisbursement
      summary: Execute an approved disbursement with an idempotent payment reference
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/DisbursementId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisbursementPayment'
      responses:
        '200':
          description: Paid state, negative ledger entry and audit event committed atomically
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/donations/{donation_id}/refunds:
    post:
      tags:
      - Donations
      operationId: refundDonation
      summary: Post an idempotent scoped refund as an authorized refund operator
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/DonationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
      responses:
        '200':
          description: Refund scope reversals, ledger entries and audit committed atomically
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/donations/payment-attempts/{attempt_id}/reconciliation:
    post:
      tags:
      - Donations
      operationId: reconcilePaymentAttempt
      summary: Resolve an unknown simulated attempt as a platform payment reconciler
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/PaymentAttemptId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentReconciliation'
      responses:
        '200':
          description: Attempt resolution and any clearing writes committed atomically
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
