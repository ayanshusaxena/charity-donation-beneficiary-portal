  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC access token validated against configured issuer, audience
        and JWKS.
    GuestAccessToken:
      type: apiKey
      in: header
      name: Guest-Access-Token
      description: High-entropy capability for one named guest donation; server stores
        only its digest.
  parameters:
    CampaignId:
      name: campaign_id
      in: path
      required: true
      description: Positive PostgreSQL BIGINT represented as a decimal string.
      schema: &id001
        $ref: '#/components/schemas/StableId'
    DonationId:
      name: donation_id
      in: path
      required: true
      description: Positive PostgreSQL BIGINT represented as a decimal string.
      schema: *id001
    OrganizationId:
      name: organization_id
      in: path
      required: true
      schema: *id001
    BeneficiaryId:
      name: beneficiary_id
      in: path
      required: true
      schema: *id001
    DisbursementId:
      name: disbursement_id
      in: path
      required: true
      schema: *id001
    PaymentAttemptId:
      name: attempt_id
      in: path
      required: true
      schema: *id001
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Operation- and principal-scoped opaque key; same payload replays
        the result, different payload conflicts.
      schema:
        type: string
        minLength: 16
        maxLength: 200
    GuestAccessToken:
      name: Guest-Access-Token
      in: header
      required: false
      description: Client-generated high-entropy guest capability; only its SHA-256
        digest is stored. Do not log it.
      schema:
        type: string
        minLength: 43
        maxLength: 128
        pattern: ^[A-Za-z0-9_-]+$
  responses:
    BadRequest:
      description: Malformed or conflicting credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication is required or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated actor is not authorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found or unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Idempotency mismatch or incompatible persisted state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Database, authentication or protected workflow is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
