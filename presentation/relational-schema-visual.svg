<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">DonateKaro relational schema at a glance</title>
  <desc id="desc">A presentation summary of the fifteen-table PostgreSQL schema, grouped into reference, operational, and financial records, with keys and integrity notes.</desc>
  <defs>
    <style>
      .bg{fill:#F6F1E8}.ink{fill:#282B29}.muted{fill:#6E716C}.title{font:700 42px Aptos,Arial,sans-serif;fill:#282B29}.subtitle{font:400 21px Aptos,Arial,sans-serif;fill:#646861}.group{font:700 18px Aptos,Arial,sans-serif;letter-spacing:1.4px;fill:#62665F}.name{font:700 21px Aptos,Arial,sans-serif;fill:#282B29}.detail{font:400 16px Aptos,Arial,sans-serif;fill:#535750}.pill{font:700 13px Aptos,Arial,sans-serif;letter-spacing:.6px}.foot{font:600 17px Aptos,Arial,sans-serif;fill:#282B29}.small{font:400 15px Aptos,Arial,sans-serif;fill:#5D625C}
      .card{fill:#FFFEFA;stroke:#D9D2C6;stroke-width:1.5}.ref{fill:#758A72}.core{fill:#C56C50}.money{fill:#B68A43}.audit{fill:#666C69}.line{stroke:#E3D9CA;stroke-width:1}
    </style>
  </defs>
  <rect class="bg" width="1920" height="1080"/>
  <circle cx="1810" cy="105" r="170" fill="#EDE4D6" opacity=".58"/>
  <text x="72" y="82" class="title">DonateKaro | Relational schema</text>
  <text x="74" y="119" class="subtitle">15 PostgreSQL tables · 32 declared foreign keys · INR-only financial records</text>
  <line x1="72" y1="143" x2="1848" y2="143" class="line"/>

  <text x="72" y="181" class="group">REFERENCE &amp; PEOPLE</text>
  <text x="682" y="181" class="group">CAMPAIGN OPERATIONS</text>
  <text x="1292" y="181" class="group">RESTRICTIONS, REFUNDS &amp; CONTROL</text>

  <!-- Reference and people -->
  <g transform="translate(72 202)"><rect width="560" height="126" rx="13" class="card"/><rect width="8" height="126" rx="4" class="ref"/><text x="24" y="34" class="name">purpose_category</text><text x="24" y="62" class="detail">PK purpose_code · purpose_name UNIQUE</text><text x="24" y="89" class="detail">Seeded codes: GENERAL · FOOD · EDUCATION · HEALTH · SHELTER</text><text x="24" y="113" class="pill" fill="#758A72">REFERENCE LOOKUP</text></g>
  <g transform="translate(72 341)"><rect width="560" height="126" rx="13" class="card"/><rect width="8" height="126" rx="4" class="ref"/><text x="24" y="34" class="name">organization</text><text x="24" y="62" class="detail">PK organization_id · registration_ref UNIQUE (nullable)</text><text x="24" y="89" class="detail">Campaign owner · contact and created timestamp</text><text x="24" y="113" class="pill" fill="#758A72">REFERENCE ENTITY</text></g>
  <g transform="translate(72 480)"><rect width="560" height="126" rx="13" class="card"/><rect width="8" height="126" rx="4" class="ref"/><text x="24" y="34" class="name">donor</text><text x="24" y="62" class="detail">PK donor_id · optional name, email and phone</text><text x="24" y="89" class="detail">Anonymous flag + CHECK; partial unique index allows at most one anonymous row</text><text x="24" y="113" class="pill" fill="#758A72">IDENTITY RECORD</text></g>
  <g transform="translate(72 619)"><rect width="560" height="126" rx="13" class="card"/><rect width="8" height="126" rx="4" class="ref"/><text x="24" y="34" class="name">beneficiary</text><text x="24" y="62" class="detail">PK beneficiary_id · type and verification status CHECKs</text><text x="24" y="89" class="detail">Verification metadata guarded and audited by workflow triggers</text><text x="24" y="113" class="pill" fill="#758A72">RECIPIENT ENTITY</text></g>
  <g transform="translate(72 758)"><rect width="560" height="126" rx="13" class="card"/><rect width="8" height="126" rx="4" class="ref"/><text x="24" y="34" class="name">donor_consent_event</text><text x="24" y="62" class="detail">PK consent_event_id · FK donor_id</text><text x="24" y="89" class="detail">GRANTED / REVOKED · append-only event with audit record</text><text x="24" y="113" class="pill" fill="#758A72">EVENT HISTORY</text></g>

  <!-- Campaign operations -->
  <g transform="translate(682 202)"><rect width="560" height="156" rx="13" class="card"/><rect width="8" height="156" rx="4" class="core"/><text x="24" y="36" class="name">campaign</text><text x="24" y="66" class="detail">PK campaign_id · FK organization_id, purpose_code</text><text x="24" y="94" class="detail">target_amount NUMERIC(14,2) &gt; 0 · approval/status CHECKs</text><text x="24" y="122" class="detail">Activation and date-window eligibility are workflow-guarded</text><text x="24" y="145" class="pill" fill="#C56C50">FUNDRAISING ROOT</text></g>
  <g transform="translate(682 376)"><rect width="560" height="156" rx="13" class="card"/><rect width="8" height="156" rx="4" class="core"/><text x="24" y="36" class="name">pledge</text><text x="24" y="66" class="detail">PK pledge_id · FK donor_id, campaign_id</text><text x="24" y="94" class="detail">pledged_amount NUMERIC(14,2) &gt; 0 · OPEN / PARTIAL / FULFILLED</text><text x="24" y="122" class="detail">One pledge may link to many donations; status is derived</text><text x="24" y="145" class="pill" fill="#C56C50">PROMISE, NOT CASH</text></g>
  <g transform="translate(682 550)"><rect width="560" height="156" rx="13" class="card"/><rect width="8" height="156" rx="4" class="core"/><text x="24" y="36" class="name">donation</text><text x="24" y="66" class="detail">PK donation_id · FK donor_id, campaign_id, optional pledge_id</text><text x="24" y="94" class="detail">donation_amount NUMERIC(14,2) · currency CHAR(3) = INR</text><text x="24" y="122" class="detail">Unique transaction / receipt references · refund state checks</text><text x="24" y="145" class="pill" fill="#C56C50">ORIGINAL GIFT RECORD</text></g>
  <g transform="translate(682 724)"><rect width="560" height="156" rx="13" class="card"/><rect width="8" height="156" rx="4" class="core"/><text x="24" y="36" class="name">disbursement</text><text x="24" y="66" class="detail">PK disbursement_id · FK campaign, beneficiary, purpose</text><text x="24" y="94" class="detail">Optional same-campaign restriction · positive amount</text><text x="24" y="122" class="detail">Unique payment_reference · paid state requires timestamp/reference</text><text x="24" y="145" class="pill" fill="#C56C50">APPROVED PAYOUT</text></g>

  <!-- Restrictions, refunds and control -->
  <g transform="translate(1292 202)"><rect width="556" height="116" rx="13" class="card"/><rect width="8" height="116" rx="4" class="money"/><text x="24" y="34" class="name">fund_restriction</text><text x="24" y="62" class="detail">PK restriction_id · FK campaign_id, allowed_purpose_code</text><text x="24" y="90" class="detail">UNIQUE (campaign_id, restriction_code)</text></g>
  <g transform="translate(1292 329)"><rect width="556" height="116" rx="13" class="card"/><rect width="8" height="116" rx="4" class="money"/><text x="24" y="34" class="name">donation_restriction</text><text x="24" y="62" class="detail">PK (donation_id, restriction_id) · campaign-scoped composite FKs</text><text x="24" y="90" class="detail">Allocation sum cap and post-clearing immutability: workflow</text></g>
  <g transform="translate(1292 456)"><rect width="556" height="116" rx="13" class="card"/><rect width="8" height="116" rx="4" class="money"/><text x="24" y="34" class="name">donation_refund</text><text x="24" y="62" class="detail">PK refund_id · FK donation + campaign</text><text x="24" y="90" class="detail">Unique refund_reference · original donation remains preserved</text></g>
  <g transform="translate(1292 583)"><rect width="556" height="116" rx="13" class="card"/><rect width="8" height="116" rx="4" class="money"/><text x="24" y="34" class="name">donation_refund_scope</text><text x="24" y="62" class="detail">PK refund_scope_id · FK refund, donation and campaign</text><text x="24" y="90" class="detail">Nullable restriction_id: NULL denotes unrestricted scope</text></g>
  <g transform="translate(1292 710)"><rect width="556" height="116" rx="13" class="card"/><rect width="8" height="116" rx="4" class="money"/><text x="24" y="34" class="name">fund_ledger_entry</text><text x="24" y="62" class="detail">PK ledger_entry_id · signed NUMERIC(14,2) deltas · INR only</text><text x="24" y="90" class="detail">Source/scope FKs + append-only guard · balances derived by scope</text></g>
  <g transform="translate(1292 837)"><rect width="556" height="116" rx="13" class="card"/><rect width="8" height="116" rx="4" class="audit"/><text x="24" y="34" class="name">audit_log</text><text x="24" y="62" class="detail">PK audit_id · actor/action/entity text + JSONB snapshots</text><text x="24" y="90" class="detail">Polymorphic entity reference; deliberately no entity FK</text></g>

  <line x1="72" y1="972" x2="1848" y2="972" class="line"/>
  <rect x="72" y="990" width="10" height="42" rx="5" fill="#758A72"/><text x="98" y="1017" class="foot">Declarative rules:</text><text x="252" y="1017" class="small">keys · checks · uniqueness · referential integrity</text>
  <rect x="720" y="990" width="10" height="42" rx="5" fill="#C56C50"/><text x="746" y="1017" class="foot">Workflow rules:</text><text x="888" y="1017" class="small">eligibility · allocation caps · atomic ledger/audit posting · state transitions</text>
  <text x="72" y="1054" class="small">Repository-derived design summary. Full columns and FK inventory: relational-schema-extracted.md · PostgreSQL 15+ · no live catalog claim.</text>
</svg>
