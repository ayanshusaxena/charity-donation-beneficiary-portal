<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">DonateKaro entity relationship model</title>
  <desc id="desc">A three-panel ER diagram showing core fundraising relationships, allocation and refund relationships, and payout relationships. It includes all fifteen physical tables and labels relationship cardinalities.</desc>
  <defs>
    <style>
      .bg{fill:#F6F1E8}.panel{fill:#FBF9F4;stroke:#E2DACD;stroke-width:1.5}.ink{fill:#282B29}.muted{fill:#696D67}.title{font:700 40px Aptos,Arial,sans-serif;fill:#282B29}.subtitle{font:400 19px Aptos,Arial,sans-serif;fill:#646861}.ptitle{font:700 17px Aptos,Arial,sans-serif;letter-spacing:1.1px;fill:#646861}.table{fill:#FFFEFA;stroke:#D8D0C4;stroke-width:1.5}.tblname{font:700 16px Aptos,Arial,sans-serif;fill:#282B29}.key{font:400 12.5px Aptos,Arial,sans-serif;fill:#646861}.edge{fill:none;stroke:#8B9189;stroke-width:2}.rel{font:700 12px Aptos,Arial,sans-serif;fill:#4E5C50}.small{font:400 13px Aptos,Arial,sans-serif;fill:#646861}.legend{font:600 14px Aptos,Arial,sans-serif;fill:#40443F}.foot{font:400 14px Aptos,Arial,sans-serif;fill:#646861}.rule{stroke:#E5DDD1;stroke-width:1}
      .accent{fill:#C56C50}.sage{fill:#758A72}.gold{fill:#B68A43}.slate{fill:#686F6B}
    </style>
    <marker id="dot" markerWidth="8" markerHeight="8" refX="4" refY="4"><circle cx="4" cy="4" r="2.5" fill="#8B9189"/></marker>
  </defs>
  <rect class="bg" width="1920" height="1080"/>
  <text x="64" y="67" class="title">DonateKaro | Entity relationship model</text>
  <text x="66" y="101" class="subtitle">Physical PostgreSQL relationships · 15 tables · 32 declared foreign keys · grouped views repeat shared tables for clarity</text>
  <line x1="64" y1="124" x2="1856" y2="124" class="rule"/>

  <!-- panel backgrounds -->
  <rect x="48" y="146" width="592" height="824" rx="18" class="panel"/>
  <rect x="664" y="146" width="592" height="824" rx="18" class="panel"/>
  <rect x="1280" y="146" width="592" height="824" rx="18" class="panel"/>
  <text x="74" y="184" class="ptitle">01  PEOPLE &amp; FUNDRAISING</text>
  <text x="690" y="184" class="ptitle">02  ALLOCATION &amp; REFUNDS</text>
  <text x="1306" y="184" class="ptitle">03  PAYOUT &amp; AUDIT</text>

  <!-- PANEL 1 connectors -->
  <g class="edge" marker-start="url(#dot)" marker-end="url(#dot)">
    <path d="M250 297 L278 366"/><path d="M438 297 L410 366"/>
    <path d="M250 598 L410 598"/><path d="M410 475 L438 544"/>
    <path d="M250 653 L278 722"/><path d="M448 440 L610 440 L610 700 L448 744"/>
    <path d="M410 653 L382 722"/><path d="M160 653 L160 836"/>
  </g>
  <!-- PANEL 1 relationship tags -->
  <g><rect x="235" y="318" width="60" height="22" rx="11" fill="#E7EEE4"/><text x="265" y="333" text-anchor="middle" class="rel">1 : N</text>
    <rect x="393" y="318" width="60" height="22" rx="11" fill="#E7EEE4"/><text x="423" y="333" text-anchor="middle" class="rel">1 : N</text>
    <rect x="300" y="587" width="60" height="22" rx="11" fill="#E7EEE4"/><text x="330" y="602" text-anchor="middle" class="rel">1 : N</text>
    <rect x="381" y="496" width="60" height="22" rx="11" fill="#E7EEE4"/><text x="411" y="511" text-anchor="middle" class="rel">1 : N</text>
    <rect x="234" y="674" width="60" height="22" rx="11" fill="#E7EEE4"/><text x="264" y="689" text-anchor="middle" class="rel">1 : N</text>
    <rect x="572" y="557" width="60" height="22" rx="11" fill="#E7EEE4"/><text x="602" y="572" text-anchor="middle" class="rel">1 : N</text>
    <rect x="390" y="674" width="78" height="22" rx="11" fill="#F3E8D3"/><text x="429" y="689" text-anchor="middle" class="rel">0..1 : N</text>
    <rect x="126" y="744" width="68" height="22" rx="11" fill="#E7EEE4"/><text x="160" y="759" text-anchor="middle" class="rel">1 : N</text>
  </g>
  <!-- PANEL 1 entities -->
  <g transform="translate(70 222)"><rect width="180" height="75" rx="10" class="table"/><rect width="6" height="75" rx="3" class="sage"/><text x="17" y="27" class="tblname">organization</text><text x="17" y="51" class="key">PK organization_id</text></g>
  <g transform="translate(348 222)"><rect width="180" height="75" rx="10" class="table"/><rect width="6" height="75" rx="3" class="sage"/><text x="17" y="27" class="tblname">purpose_category</text><text x="17" y="51" class="key">PK purpose_code</text></g>
  <g transform="translate(208 366)"><rect width="240" height="109" rx="10" class="table"/><rect width="6" height="109" rx="3" class="accent"/><text x="18" y="28" class="tblname">campaign</text><text x="18" y="51" class="key">PK campaign_id</text><text x="18" y="71" class="key">FK organization_id</text><text x="18" y="91" class="key">FK purpose_code</text></g>
  <g transform="translate(70 544)"><rect width="180" height="109" rx="10" class="table"/><rect width="6" height="109" rx="3" class="sage"/><text x="17" y="28" class="tblname">donor</text><text x="17" y="51" class="key">PK donor_id</text><text x="17" y="75" class="key">anonymous flag</text></g>
  <g transform="translate(410 544)"><rect width="180" height="109" rx="10" class="table"/><rect width="6" height="109" rx="3" class="accent"/><text x="17" y="28" class="tblname">pledge</text><text x="17" y="51" class="key">PK pledge_id</text><text x="17" y="75" class="key">FK donor, campaign</text></g>
  <g transform="translate(208 722)"><rect width="240" height="109" rx="10" class="table"/><rect width="6" height="109" rx="3" class="accent"/><text x="18" y="28" class="tblname">donation</text><text x="18" y="51" class="key">PK donation_id</text><text x="18" y="72" class="key">FK donor, campaign</text><text x="18" y="92" class="key">FK optional pledge_id</text></g>
  <g transform="translate(70 836)"><rect width="180" height="75" rx="10" class="table"/><rect width="6" height="75" rx="3" class="sage"/><text x="17" y="27" class="tblname">donor_consent_event</text><text x="17" y="51" class="key">FK donor_id</text></g>
  <text x="270" y="880" class="small">Pledge may link to many donations.</text>

  <!-- PANEL 2 connectors -->
  <g class="edge" marker-start="url(#dot)" marker-end="url(#dot)">
    <path d="M860 300 L860 366"/><path d="M930 300 L950 330 L970 390"/><path d="M1060 300 L1060 366"/>
    <path d="M805 475 L848 544"/><path d="M1110 475 L1067 544"/>
    <path d="M848 653 L805 722"/><path d="M1067 653 L1110 722"/>
    <path d="M950 776 L970 776"/><path d="M1000 831 L1000 836"/>
    <path d="M770 260 L730 260 L730 860 L860 860"/>
    <path d="M770 420 L750 420 L750 886 L860 886"/>
    <path d="M1150 420 L1180 420 L1180 900 L1080 900"/>
  </g>
  <g><rect x="830" y="321" width="60" height="22" rx="11" fill="#E7EEE4"/><text x="860" y="336" text-anchor="middle" class="rel">1 : N</text>
    <rect x="887" y="321" width="60" height="22" rx="11" fill="#E7EEE4"/><text x="917" y="336" text-anchor="middle" class="rel">1 : N</text>
    <rect x="1030" y="321" width="60" height="22" rx="11" fill="#E7EEE4"/><text x="1060" y="336" text-anchor="middle" class="rel">1 : N</text>
    <rect x="793" y="498" width="60" height="22" rx="11" fill="#E7EEE4"/><text x="823" y="513" text-anchor="middle" class="rel">1 : N</text>
    <rect x="1050" y="498" width="60" height="22" rx="11" fill="#E7EEE4"/><text x="1080" y="513" text-anchor="middle" class="rel">1 : N</text>
    <rect x="788" y="674" width="60" height="22" rx="11" fill="#E7EEE4"/><text x="818" y="689" text-anchor="middle" class="rel">1 : N</text>
    <rect x="1068" y="674" width="78" height="22" rx="11" fill="#F3E8D3"/><text x="1107" y="689" text-anchor="middle" class="rel">0..1 : N</text>
    <rect x="677" y="842" width="60" height="22" rx="11" fill="#E7EEE4"/><text x="707" y="857" text-anchor="middle" class="rel">1 : N</text>
    <rect x="677" y="879" width="60" height="22" rx="11" fill="#E7EEE4"/><text x="707" y="894" text-anchor="middle" class="rel">1 : N</text>
    <rect x="1148" y="844" width="78" height="22" rx="11" fill="#F3E8D3"/><text x="1187" y="859" text-anchor="middle" class="rel">0..1 : N</text>
  </g>
  <!-- PANEL 2 entities -->
  <g transform="translate(770 222)"><rect width="180" height="78" rx="10" class="table"/><rect width="6" height="78" rx="3" class="accent"/><text x="16" y="29" class="tblname">campaign</text><text x="16" y="53" class="key">PK campaign_id</text></g>
  <g transform="translate(970 222)"><rect width="180" height="78" rx="10" class="table"/><rect width="6" height="78" rx="3" class="sage"/><text x="16" y="29" class="tblname">purpose_category</text><text x="16" y="53" class="key">PK purpose_code</text></g>
  <g transform="translate(770 366)"><rect width="180" height="109" rx="10" class="table"/><rect width="6" height="109" rx="3" class="accent"/><text x="16" y="28" class="tblname">donation</text><text x="16" y="52" class="key">PK donation_id</text><text x="16" y="76" class="key">FK campaign_id</text></g>
  <g transform="translate(970 366)"><rect width="180" height="109" rx="10" class="table"/><rect width="6" height="109" rx="3" class="gold"/><text x="16" y="28" class="tblname">fund_restriction</text><text x="16" y="52" class="key">PK restriction_id</text><text x="16" y="76" class="key">FK campaign_id</text></g>
  <g transform="translate(860 544)"><rect width="220" height="109" rx="10" class="table"/><rect width="6" height="109" rx="3" class="gold"/><text x="17" y="28" class="tblname">donation_restriction</text><text x="17" y="52" class="key">PK donation_id + restriction_id</text><text x="17" y="76" class="key">composite campaign FKs</text></g>
  <g transform="translate(770 722)"><rect width="180" height="109" rx="10" class="table"/><rect width="6" height="109" rx="3" class="gold"/><text x="16" y="28" class="tblname">donation_refund</text><text x="16" y="52" class="key">PK refund_id</text><text x="16" y="76" class="key">FK donation + campaign</text></g>
  <g transform="translate(970 722)"><rect width="180" height="109" rx="10" class="table"/><rect width="6" height="109" rx="3" class="gold"/><text x="16" y="28" class="tblname">donation_refund_scope</text><text x="16" y="52" class="key">PK refund_scope_id</text><text x="16" y="76" class="key">optional restriction</text></g>
  <g transform="translate(860 836)"><rect width="220" height="78" rx="10" class="table"/><rect width="6" height="78" rx="3" class="gold"/><text x="17" y="29" class="tblname">fund_ledger_entry</text><text x="17" y="53" class="key">PK ledger_entry_id</text></g>
  <text x="690" y="938" class="small">NULL restriction = unrestricted scope; refunds cannot borrow across scopes.</text>
  <text x="690" y="956" class="small">Each refund scope has at most one ledger event; the workflow creates it atomically.</text>

  <!-- PANEL 3 connectors -->
  <g class="edge" marker-start="url(#dot)" marker-end="url(#dot)">
    <path d="M1540 280 L1550 300 L1550 544"/><path d="M1740 280 L1760 510 L1650 544"/>
    <path d="M1450 475 L1500 544"/><path d="M1650 475 L1600 544"/>
    <path d="M1560 653 L1560 722"/>
    <path d="M1360 260 L1325 260 L1325 700 L1450 760"/>
  </g>
  <g><rect x="1485" y="316" width="60" height="22" rx="11" fill="#E7EEE4"/><text x="1515" y="331" text-anchor="middle" class="rel">1 : N</text>
    <rect x="1742" y="397" width="60" height="22" rx="11" fill="#E7EEE4"/><text x="1772" y="412" text-anchor="middle" class="rel">1 : N</text>
    <rect x="1312" y="489" width="60" height="22" rx="11" fill="#E7EEE4"/><text x="1342" y="504" text-anchor="middle" class="rel">1 : N</text>
    <rect x="1445" y="499" width="60" height="22" rx="11" fill="#E7EEE4"/><text x="1475" y="514" text-anchor="middle" class="rel">1 : N</text>
    <rect x="1588" y="499" width="60" height="22" rx="11" fill="#F3E8D3"/><text x="1618" y="514" text-anchor="middle" class="rel">0..1 : N</text>
    <rect x="1530" y="674" width="78" height="22" rx="11" fill="#F3E8D3"/><text x="1569" y="689" text-anchor="middle" class="rel">0..1 : 0..1</text>
  </g>
  <!-- PANEL 3 entities -->
  <g transform="translate(1360 222)"><rect width="180" height="78" rx="10" class="table"/><rect width="6" height="78" rx="3" class="accent"/><text x="16" y="29" class="tblname">campaign</text><text x="16" y="53" class="key">PK campaign_id</text></g>
  <g transform="translate(1560 222)"><rect width="180" height="78" rx="10" class="table"/><rect width="6" height="78" rx="3" class="sage"/><text x="16" y="29" class="tblname">purpose_category</text><text x="16" y="53" class="key">PK purpose_code</text></g>
  <g transform="translate(1360 366)"><rect width="180" height="109" rx="10" class="table"/><rect width="6" height="109" rx="3" class="sage"/><text x="16" y="28" class="tblname">beneficiary</text><text x="16" y="52" class="key">PK beneficiary_id</text><text x="16" y="76" class="key">verified before payment</text></g>
  <g transform="translate(1560 366)"><rect width="180" height="109" rx="10" class="table"/><rect width="6" height="109" rx="3" class="gold"/><text x="16" y="28" class="tblname">fund_restriction</text><text x="16" y="52" class="key">PK restriction_id</text><text x="16" y="76" class="key">optional same-campaign FK</text></g>
  <g transform="translate(1450 544)"><rect width="220" height="109" rx="10" class="table"/><rect width="6" height="109" rx="3" class="accent"/><text x="17" y="28" class="tblname">disbursement</text><text x="17" y="52" class="key">PK disbursement_id</text><text x="17" y="76" class="key">FK campaign, recipient, purpose</text></g>
  <g transform="translate(1450 722)"><rect width="220" height="109" rx="10" class="table"/><rect width="6" height="109" rx="3" class="gold"/><text x="17" y="28" class="tblname">fund_ledger_entry</text><text x="17" y="52" class="key">PK ledger_entry_id</text><text x="17" y="76" class="key">one payout event per disbursement</text></g>
  <g transform="translate(1450 836)"><rect width="220" height="78" rx="10" class="table"/><rect width="6" height="78" rx="3" class="slate"/><text x="17" y="29" class="tblname">audit_log</text><text x="17" y="53" class="key">polymorphic text reference</text></g>
  <text x="1306" y="944" class="small">Audit is shown without links: entity_type/entity_id are not foreign keys.</text>

  <line x1="64" y1="994" x2="1856" y2="994" class="rule"/>
  <text x="66" y="1025" class="legend">Cardinality:</text><text x="158" y="1025" class="small">1 : N = one parent to zero or many children</text><text x="592" y="1025" class="small">0..1 : N = optional parent for each child</text>
  <text x="1120" y="1025" class="small">The model shows declared FKs. Triggers add business rules; they do not authenticate actors.</text>
  <text x="66" y="1053" class="foot">Repository-source model · PostgreSQL 15+ · composite FKs enforce campaign/scope consistency · no live catalog inspection</text>
</svg>
