<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">DonateKaro abstracted Chen entity relationship model</title>
  <desc id="desc">A spacious, presentation-ready Chen ER model. Rectangles are entities, diamonds are relationships, ovals are attributes, and labels show cardinalities.</desc>
  <defs>
    <style>
      .canvas { fill: #e9dfcf; }
      .paper { fill: #fffdf9; }
      .title { font: 600 40px Georgia, serif; fill: #34352f; }
      .subtitle { font: 17px Arial, sans-serif; fill: #66645d; }
      .entity { fill: #e9eee5; stroke: #64765f; stroke-width: 3; }
      .relationship { fill: #f4e1d8; stroke: #bc684d; stroke-width: 2.5; }
      .attribute { fill: #f3e8d3; stroke: #b68a43; stroke-width: 2; }
      .line { fill: none; stroke: #53564e; stroke-width: 2.35; stroke-linecap: round; stroke-linejoin: round; }
      .entity-label { font: 600 19px Arial, sans-serif; fill: #30322e; text-anchor: middle; dominant-baseline: middle; }
      .relationship-label { font: 600 13px Arial, sans-serif; fill: #6a3e31; text-anchor: middle; dominant-baseline: middle; }
      .attribute-label { font: 15px Arial, sans-serif; fill: #383933; text-anchor: middle; dominant-baseline: middle; }
      .cardinality { font: 600 14px Arial, sans-serif; fill: #34352f; paint-order: stroke; stroke: #fffdf9; stroke-width: 5px; stroke-linejoin: round; }
      .legend { font: 14px Arial, sans-serif; fill: #44453f; }
      .note { font: 15px Arial, sans-serif; fill: #4b4b45; }
    </style>
  </defs>

  <rect class="canvas" width="1920" height="1080"/>
  <rect class="paper" x="34" y="112" width="1852" height="928" rx="5"/>
  <text class="title" x="76" y="68">DonateKaro | Abstracted ER Model</text>
  <text class="subtitle" x="77" y="97">Chen notation, aligned around the core campaign, contribution, payout, ledger, and audit concepts</text>

  <!-- Core relationship lines, kept behind every node. -->
  <g class="line">
    <!-- Contribution area -->
    <path d="M 264 438 L 330 355 L 397 322"/>
    <path d="M 473 322 L 510 306"/>
    <path d="M 264 466 L 330 547 L 397 570"/>
    <path d="M 473 570 L 510 578"/>
    <path d="M 650 300 L 697 324"/>
    <path d="M 773 324 L 865 344"/>
    <path d="M 650 578 L 697 556"/>
    <path d="M 773 556 L 865 382"/>
    <path d="M 580 334 L 580 400"/>
    <path d="M 580 474 L 580 546"/>
    <!-- Payout area -->
    <path d="M 1015 383 L 1165 458"/>
    <path d="M 1235 476 L 1395 556"/>
    <path d="M 1510 336 L 1510 423"/>
    <path d="M 1510 493 L 1510 548"/>
    <!-- Ledger area -->
    <path d="M 940 412 L 940 629"/>
    <path d="M 940 703 L 940 730"/>
    <path d="M 650 604 L 760 688"/>
    <path d="M 830 713 L 854 755"/>
    <path d="M 1410 604 L 1245 705"/>
    <path d="M 1175 745 L 1035 779"/>
  </g>

  <!-- Relationship diamonds and their cardinality labels. -->
  <g>
    <polygon class="relationship" points="435,286 473,322 435,358 397,322"/>
    <text class="relationship-label" x="435" y="322">MAKES</text>
    <text class="cardinality" x="281" y="416">1</text><text class="cardinality" x="486" y="314">0..N</text>
    <polygon class="relationship" points="435,534 473,570 435,606 397,570"/>
    <text class="relationship-label" x="435" y="570">GIVES</text>
    <text class="cardinality" x="283" y="493">1</text><text class="cardinality" x="486" y="578">0..N</text>
    <polygon class="relationship" points="735,288 773,324 735,360 697,324"/>
    <text class="relationship-label" x="735" y="324">FOR</text>
    <text class="cardinality" x="678" y="315">1</text><text class="cardinality" x="788" y="329">0..N</text>
    <polygon class="relationship" points="735,520 773,556 735,592 697,556"/>
    <text class="relationship-label" x="735" y="556">RECEIVES</text>
    <text class="cardinality" x="677" y="560">1</text><text class="cardinality" x="786" y="541">0..N</text>
    <polygon class="relationship" points="580,400 617,437 580,474 543,437"/>
    <text class="relationship-label" x="580" y="437">FULFILLS</text>
    <text class="cardinality" x="592" y="388">0..N</text><text class="cardinality" x="592" y="495">0..1</text>
    <polygon class="relationship" points="1200,440 1238,476 1200,512 1162,476"/>
    <text class="relationship-label" x="1200" y="476">FUNDS</text>
    <text class="cardinality" x="1031" y="406">1</text><text class="cardinality" x="1252" y="483">0..N</text>
    <polygon class="relationship" points="1510,423 1547,458 1510,493 1473,458"/>
    <text class="relationship-label" x="1510" y="458">RECEIVES</text>
    <text class="cardinality" x="1524" y="410">0..N</text><text class="cardinality" x="1524" y="517">1</text>
    <polygon class="relationship" points="940,629 978,666 940,703 902,666"/>
    <text class="relationship-label" x="940" y="666">RECORDS</text>
    <text class="cardinality" x="953" y="614">1</text><text class="cardinality" x="953" y="724">0..N</text>
    <polygon class="relationship" points="795,676 832,713 795,750 758,713"/>
    <text class="relationship-label" x="795" y="713">SOURCE</text>
    <text class="cardinality" x="686" y="659">0..N</text><text class="cardinality" x="840" y="692">0..1</text>
    <polygon class="relationship" points="1210,708 1247,745 1210,782 1173,745"/>
    <text class="relationship-label" x="1210" y="745">POSTS</text>
    <text class="cardinality" x="1310" y="646">0..1</text><text class="cardinality" x="1141" y="771">0..1</text>
  </g>

  <!-- Business entity rectangles. -->
  <g>
    <rect class="entity" x="138" y="428" width="126" height="48" rx="3"/><text class="entity-label" x="201" y="452">Donor</text>
    <rect class="entity" x="510" y="276" width="140" height="58" rx="3"/><text class="entity-label" x="580" y="305">Pledge</text>
    <rect class="entity" x="865" y="330" width="150" height="82" rx="3"/><text class="entity-label" x="940" y="371">Campaign</text>
    <rect class="entity" x="510" y="546" width="140" height="58" rx="3"/><text class="entity-label" x="580" y="575">Donation</text>
    <rect class="entity" x="1440" y="288" width="140" height="48" rx="3"/><text class="entity-label" x="1510" y="312">Beneficiary</text>
    <rect class="entity" x="1410" y="548" width="200" height="58" rx="3"/><text class="entity-label" x="1510" y="577">Disbursement</text>
    <rect class="entity" x="854" y="755" width="170" height="54" rx="3"/><text class="entity-label" x="939" y="782">Fund Ledger</text>
    <rect class="entity" x="1515" y="772" width="176" height="54" rx="3"/><text class="entity-label" x="1603" y="799">Audit Record</text>
  </g>

  <!-- Attribute clusters use the open outer areas around each entity. -->
  <g>
    <!-- Donor -->
    <ellipse class="attribute" cx="132" cy="354" rx="76" ry="24"/><text class="attribute-label" x="132" y="354">donor_id (PK)</text><path class="line" d="M 166 377 L 186 428"/>
    <ellipse class="attribute" cx="118" cy="450" rx="77" ry="23"/><text class="attribute-label" x="118" y="450">display_name</text><path class="line" d="M 195 450 L 138 450"/>
    <ellipse class="attribute" cx="220" cy="525" rx="91" ry="23"/><text class="attribute-label" x="220" y="525">anonymous_record</text><path class="line" d="M 214 502 L 209 476"/>
    <!-- Pledge -->
    <ellipse class="attribute" cx="480" cy="190" rx="80" ry="24"/><text class="attribute-label" x="480" y="190">pledge_id (PK)</text><path class="line" d="M 515 211 L 546 276"/>
    <ellipse class="attribute" cx="622" cy="183" rx="86" ry="23"/><text class="attribute-label" x="622" y="183">pledged_amount</text><path class="line" d="M 615 206 L 600 276"/>
    <ellipse class="attribute" cx="700" cy="250" rx="72" ry="23"/><text class="attribute-label" x="700" y="250">pledge_status</text><path class="line" d="M 658 263 L 640 277"/>
    <!-- Campaign -->
    <ellipse class="attribute" cx="816" cy="235" rx="90" ry="24"/><text class="attribute-label" x="816" y="235">campaign_id (PK)</text><path class="line" d="M 863 254 L 895 330"/>
    <ellipse class="attribute" cx="956" cy="214" rx="76" ry="23"/><text class="attribute-label" x="956" y="214">target_amount</text><path class="line" d="M 953 237 L 948 330"/>
    <ellipse class="attribute" cx="1084" cy="257" rx="78" ry="23"/><text class="attribute-label" x="1084" y="257">purpose_code</text><path class="line" d="M 1034 275 L 991 330"/>
    <!-- Donation -->
    <ellipse class="attribute" cx="454" cy="665" rx="91" ry="24"/><text class="attribute-label" x="454" y="665">donation_id (PK)</text><path class="line" d="M 508 647 L 535 604"/>
    <ellipse class="attribute" cx="580" cy="697" rx="62" ry="23"/><text class="attribute-label" x="580" y="697">amount</text><path class="line" d="M 580 674 L 580 604"/>
    <ellipse class="attribute" cx="717" cy="662" rx="82" ry="23"/><text class="attribute-label" x="717" y="662">payment_status</text><path class="line" d="M 677 643 L 632 603"/>
    <ellipse class="attribute" cx="754" cy="594" rx="80" ry="23"/><text class="attribute-label" x="754" y="594">receipt_number</text><path class="line" d="M 674 590 L 650 587"/>
    <!-- Beneficiary -->
    <ellipse class="attribute" cx="1420" cy="211" rx="91" ry="24"/><text class="attribute-label" x="1420" y="211">beneficiary_id (PK)</text><path class="line" d="M 1463 232 L 1487 288"/>
    <ellipse class="attribute" cx="1570" cy="210" rx="82" ry="23"/><text class="attribute-label" x="1570" y="210">beneficiary_name</text><path class="line" d="M 1553 233 L 1536 288"/>
    <ellipse class="attribute" cx="1695" cy="310" rx="92" ry="23"/><text class="attribute-label" x="1695" y="310">verification_status</text><path class="line" d="M 1600 311 L 1580 311"/>
    <!-- Disbursement -->
    <ellipse class="attribute" cx="1313" cy="505" rx="103" ry="24"/><text class="attribute-label" x="1313" y="505">disbursement_id (PK)</text><path class="line" d="M 1365 524 L 1410 556"/>
    <ellipse class="attribute" cx="1420" cy="676" rx="62" ry="23"/><text class="attribute-label" x="1420" y="676">amount</text><path class="line" d="M 1450 654 L 1471 606"/>
    <ellipse class="attribute" cx="1590" cy="676" rx="108" ry="23"/><text class="attribute-label" x="1590" y="676">approval/payment status</text><path class="line" d="M 1563 653 L 1547 606"/>
    <!-- Fund Ledger -->
    <ellipse class="attribute" cx="784" cy="857" rx="98" ry="24"/><text class="attribute-label" x="784" y="857">ledger_entry_id (PK)</text><path class="line" d="M 844 840 L 878 808"/>
    <ellipse class="attribute" cx="949" cy="895" rx="83" ry="23"/><text class="attribute-label" x="949" y="895">amount_delta</text><path class="line" d="M 947 872 L 943 809"/>
    <ellipse class="attribute" cx="1102" cy="852" rx="69" ry="23"/><text class="attribute-label" x="1102" y="852">currency</text><path class="line" d="M 1053 837 L 1010 808"/>
    <!-- Audit is standalone because it has no enforced entity FK. -->
    <ellipse class="attribute" cx="1493" cy="876" rx="76" ry="23"/><text class="attribute-label" x="1493" y="876">audit_id (PK)</text><path class="line" d="M 1539 857 L 1560 826"/>
    <ellipse class="attribute" cx="1642" cy="876" rx="74" ry="23"/><text class="attribute-label" x="1642" y="876">action_type</text><path class="line" d="M 1627 854 L 1620 826"/>
    <ellipse class="attribute" cx="1603" cy="942" rx="118" ry="24"/><text class="attribute-label" x="1603" y="942">entity_type + entity_id*</text><path class="line" d="M 1603 918 L 1603 826"/>
  </g>

  <!-- Bottom key and essential model notes. -->
  <line x1="76" y1="972" x2="1844" y2="972" stroke="#d7d0c4" stroke-width="1.5"/>
  <rect class="entity" x="84" y="993" width="34" height="23" rx="2"/><text class="legend" x="128" y="1010">Entity</text>
  <polygon class="relationship" points="236,993 254,1005 236,1017 218,1005"/><text class="legend" x="265" y="1010">Relationship</text>
  <ellipse class="attribute" cx="405" cy="1005" rx="20" ry="12"/><text class="legend" x="433" y="1010">Attribute</text>
  <text class="note" x="565" y="1004">Pledge records a promise. Donations and beneficiary payments follow separate workflows.</text>
  <text class="note" x="565" y="1026">* Audit uses a polymorphic text reference, without a foreign key. Cardinalities reflect declared FK and unique constraints.</text>
</svg>
