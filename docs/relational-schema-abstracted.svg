<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">DonateKaro abstracted relational schema</title>
  <desc id="desc">Presentation-ready relational schema with eight table cards, selected columns, primary and foreign keys, and references.</desc>
  <defs>
    <style>
      .bg{fill:#f4f0e8}.page{fill:#fffdf9}.title{font:600 39px Arial,sans-serif;fill:#454239}.kicker{font:700 21px Arial,sans-serif;fill:#18356f;letter-spacing:1px}
      .card{fill:#fff;stroke-width:4}.head{stroke-width:4}.foot{fill:#fff}.donor{stroke:#527da9}.donorhead{fill:#e1edf8}.pledge{stroke:#d1a443}.pledgehead{fill:#fff1cc}.campaign{stroke:#36999b}.campaignhead{fill:#d9f2f1}.donation{stroke:#c9636e}.donationhead{fill:#f9e2e4}.beneficiary{stroke:#8660b5}.beneficiaryhead{fill:#eee3fa}.disbursement{stroke:#20a8b4}.disbursementhead{fill:#d9f7f8}.ledger{stroke:#6e9f39}.ledgerhead{fill:#e9f5d2}.audit{stroke:#7eaa34}.audithead{fill:#e9f5d2}
      .table-name{font:700 18px Arial,sans-serif;fill:#24272b;text-anchor:middle;dominant-baseline:middle}.column{font:16px Arial,sans-serif;fill:#292b2c;dominant-baseline:middle}.tag{font:700 14px Arial,sans-serif;fill:#a83232}.tagfk{fill:#2167a2}.dim{font:14px Arial,sans-serif;fill:#545650}.line{fill:none;stroke:#3979b2;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.note{font:15px Arial,sans-serif;fill:#454640}.legend{font:15px Arial,sans-serif;fill:#3e4142}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3979b2"/></marker>
  </defs>
  <rect class="bg" width="1920" height="1080"/>
  <text class="title" x="960" y="61" text-anchor="middle">Relational Schema — DonateKaro Charity Portal</text>
  <rect class="page" x="34" y="102" width="1852" height="936" rx="4"/>
  <text class="kicker" x="960" y="144" text-anchor="middle">ABSTRACTED RELATIONS</text>

  <!-- FK references, routed behind the table cards. -->
  <g class="line" marker-end="url(#arrow)">
    <path d="M 530 327 L 485 327 L 485 295 L 382 295"/>
    <path d="M 530 353 L 475 353 L 475 295 L 382 295"/>
    <path d="M 530 598 L 452 598 L 452 295 L 382 295"/>
    <path d="M 530 624 L 465 624 L 465 295 L 382 295"/>
    <path d="M 530 651 L 1015 651 L 1015 294 L 1080 294"/>
    <path d="M 530 677 L 497 677 L 497 376 L 620 376"/>
    <path d="M 1080 488 L 1036 488 L 1036 330 L 1080 330"/>
    <path d="M 1080 514 L 1048 514 L 1048 294 L 1080 294"/>
    <path d="M 1490 529 L 1456 529 L 1456 385 L 1490 385"/>
    <path d="M 1490 554 L 1471 554 L 1471 294 L 1490 294"/>
  </g>

  <!-- DONOR -->
  <g>
    <rect class="card donor" x="112" y="202" width="270" height="172" rx="9"/>
    <path class="donorhead" d="M121 202 H373 Q382 202 382 211 V246 H112 V211 Q112 202 121 202Z"/>
    <line class="donor" x1="112" y1="246" x2="382" y2="246"/>
    <text class="table-name" x="247" y="225">DONOR</text>
    <text class="column" x="130" y="273">donor_id</text><text class="tag" x="323" y="273">(PK)</text>
    <text class="column" x="130" y="302">display_name</text>
    <text class="column" x="130" y="331">is_anonymous_record</text>
    <line class="donor" x1="112" y1="341" x2="382" y2="341"/><text class="dim" x="130" y="360">PK: donor_id</text>
  </g>

  <!-- PLEDGE -->
  <g>
    <rect class="card pledge" x="530" y="202" width="270" height="202" rx="9"/>
    <path class="pledgehead" d="M539 202 H791 Q800 202 800 211 V246 H530 V211 Q530 202 539 202Z"/>
    <line class="pledge" x1="530" y1="246" x2="800" y2="246"/>
    <text class="table-name" x="665" y="225">PLEDGE</text>
    <text class="column" x="548" y="270">pledge_id</text><text class="tag" x="735" y="270">(PK)</text>
    <text class="column" x="548" y="295">donor_id</text><text class="tagfk" x="735" y="295">(FK)</text>
    <text class="column" x="548" y="320">campaign_id</text><text class="tagfk" x="735" y="320">(FK)</text>
    <text class="column" x="548" y="345">pledged_amount</text>
    <text class="column" x="548" y="370">pledge_status</text>
    <line class="pledge" x1="530" y1="376" x2="800" y2="376"/><text class="dim" x="548" y="395">Promise only, not cash</text>
  </g>

  <!-- CAMPAIGN -->
  <g>
    <rect class="card campaign" x="1080" y="202" width="300" height="214" rx="9"/>
    <path class="campaignhead" d="M1089 202 H1371 Q1380 202 1380 211 V246 H1080 V211 Q1080 202 1089 202Z"/>
    <line class="campaign" x1="1080" y1="246" x2="1380" y2="246"/>
    <text class="table-name" x="1230" y="225">CAMPAIGN</text>
    <text class="column" x="1098" y="270">campaign_id</text><text class="tag" x="1315" y="270">(PK)</text>
    <text class="column" x="1098" y="295">campaign_name</text>
    <text class="column" x="1098" y="320">purpose_code</text><text class="tagfk" x="1315" y="320">(FK)</text>
    <text class="column" x="1098" y="345">target_amount</text>
    <text class="column" x="1098" y="370">campaign_status</text>
    <line class="campaign" x1="1080" y1="385" x2="1380" y2="385"/><text class="dim" x="1098" y="405">Also references organization/category</text>
  </g>

  <!-- BENEFICIARY -->
  <g>
    <rect class="card beneficiary" x="1490" y="202" width="300" height="156" rx="9"/>
    <path class="beneficiaryhead" d="M1499 202 H1781 Q1790 202 1790 211 V246 H1490 V211 Q1490 202 1499 202Z"/>
    <line class="beneficiary" x1="1490" y1="246" x2="1790" y2="246"/>
    <text class="table-name" x="1640" y="225">BENEFICIARY</text>
    <text class="column" x="1508" y="273">beneficiary_id</text><text class="tag" x="1723" y="273">(PK)</text>
    <text class="column" x="1508" y="302">beneficiary_name</text>
    <text class="column" x="1508" y="331">verification_status</text>
    <line class="beneficiary" x1="1490" y1="338" x2="1790" y2="338"/><text class="dim" x="1508" y="351">PK: beneficiary_id</text>
  </g>

  <!-- DONATION -->
  <g>
    <rect class="card donation" x="530" y="488" width="470" height="230" rx="9"/>
    <path class="donationhead" d="M539 488 H991 Q1000 488 1000 497 V532 H530 V497 Q530 488 539 488Z"/>
    <line class="donation" x1="530" y1="532" x2="1000" y2="532"/>
    <text class="table-name" x="765" y="511">DONATION</text>
    <text class="column" x="548" y="557">donation_id</text><text class="tag" x="752" y="557">(PK)</text>
    <text class="column" x="548" y="583">donor_id</text><text class="tagfk" x="752" y="583">(FK)</text>
    <text class="column" x="548" y="609">campaign_id</text><text class="tagfk" x="752" y="609">(FK)</text>
    <text class="column" x="548" y="635">pledge_id NULL</text><text class="tagfk" x="752" y="635">(FK)</text>
    <text class="column" x="548" y="671">donation_amount</text>
    <text class="column" x="785" y="557">payment_status</text>
    <text class="column" x="785" y="583">receipt_number</text>
    <text class="column" x="785" y="609">currency: INR</text>
    <line class="donation" x1="530" y1="651" x2="1000" y2="651"/><text class="dim" x="548" y="690">PK: donation_id · original donation retained</text>
  </g>

  <!-- DISBURSEMENT -->
  <g>
    <rect class="card disbursement" x="1490" y="452" width="300" height="204" rx="9"/>
    <path class="disbursementhead" d="M1499 452 H1781 Q1790 452 1790 461 V496 H1490 V461 Q1490 452 1499 452Z"/>
    <line class="disbursement" x1="1490" y1="496" x2="1790" y2="496"/>
    <text class="table-name" x="1640" y="475">DISBURSEMENT</text>
    <text class="column" x="1508" y="521">disbursement_id</text><text class="tag" x="1738" y="521">(PK)</text>
    <text class="column" x="1508" y="548">campaign_id</text><text class="tagfk" x="1738" y="548">(FK)</text>
    <text class="column" x="1508" y="575">beneficiary_id</text><text class="tagfk" x="1738" y="575">(FK)</text>
    <text class="column" x="1508" y="602">disbursement_amount</text>
    <text class="column" x="1508" y="629">approval / payment status</text>
    <line class="disbursement" x1="1490" y1="638" x2="1790" y2="638"/>
  </g>

  <!-- FUND LEDGER -->
  <g>
    <rect class="card ledger" x="1080" y="702" width="390" height="218" rx="9"/>
    <path class="ledgerhead" d="M1089 702 H1461 Q1470 702 1470 711 V746 H1080 V711 Q1080 702 1089 702Z"/>
    <line class="ledger" x1="1080" y1="746" x2="1470" y2="746"/>
    <text class="table-name" x="1275" y="725">FUND LEDGER</text>
    <text class="column" x="1098" y="771">ledger_entry_id</text><text class="tag" x="1355" y="771">(PK)</text>
    <text class="column" x="1098" y="798">campaign_id</text><text class="tagfk" x="1355" y="798">(FK)</text>
    <text class="column" x="1098" y="825">donation_id NULL</text><text class="tagfk" x="1355" y="825">(FK)</text>
    <text class="column" x="1098" y="852">disbursement_id NULL</text><text class="tagfk" x="1355" y="852">(FK)</text>
    <text class="column" x="1098" y="879">amount_delta · currency INR</text>
    <line class="ledger" x1="1080" y1="895" x2="1470" y2="895"/><text class="dim" x="1098" y="913">Nullable source FKs; signed events</text>
  </g>

  <!-- AUDIT RECORD -->
  <g>
    <rect class="card audit" x="1510" y="752" width="280" height="168" rx="9"/>
    <path class="audithead" d="M1519 752 H1781 Q1790 752 1790 761 V796 H1510 V761 Q1510 752 1519 752Z"/>
    <line class="audit" x1="1510" y1="796" x2="1790" y2="796"/>
    <text class="table-name" x="1650" y="775">AUDIT RECORD</text>
    <text class="column" x="1528" y="823">audit_id</text><text class="tag" x="1723" y="823">(PK)</text>
    <text class="column" x="1528" y="849">actor_id · action_type</text>
    <text class="column" x="1528" y="875">entity_type · entity_id</text>
    <text class="column" x="1528" y="901">occurred_at</text>
  </g>

  <!-- Reference labels clarify routing without implying relationships for audit. -->
  <g class="note">
    <text x="394" y="278">DONOR FK</text>
    <text x="1036" y="464">CAMPAIGN FK</text>
    <text x="1017" y="634">DONATION FK</text>
    <text x="1478" y="425">BENEFICIARY FK</text>
    <text x="1260" y="968">Audit entity identity is polymorphic text; no FK is enforced.</text>
  </g>

  <line x1="78" y1="946" x2="1840" y2="946" stroke="#d6d1c8" stroke-width="1.5"/>
  <g transform="translate(94 976)">
    <text class="legend" x="0" y="0"><tspan fill="#a83232" font-weight="700">PK</tspan><tspan>  Primary key</tspan></text>
    <text class="legend" x="175" y="0"><tspan fill="#2167a2" font-weight="700">FK</tspan><tspan>  Foreign key</tspan></text>
    <text class="legend" x="350" y="0">NULL  Optional reference</text>
    <text class="legend" x="620" y="0">Blue connectors show enforced references</text>
    <text class="legend" x="0" y="31">Presentation view of eight core relations · full schema retains omitted organization, purpose, restriction, refund, consent, and constraint details</text>
  </g>
</svg>
